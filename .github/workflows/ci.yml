name: Pipeline CI

on:
  push:
    branches: [ "main" ]

jobs:
  testes-unitarios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o ambiente virtual
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Executar os testes unitários
        run: |
          pytest tests/unit

  testes-integracao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o ambiente virtual
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Executar os testes de integração
        run: |
          pytest tests/integration

  testes-e2e:
    runs-on: ubuntu-latest
    needs: 
      - testes-unitarios
      - testes-integracao
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o ambiente virtual
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Executar os testes end-to-end
        run: |
          pytest tests/e2e